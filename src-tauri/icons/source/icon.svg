<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="1" stop-color="#7A3FE0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FB"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B0F5C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- whiteboard -->
  <rect x="164" y="214" width="696" height="520" rx="64" fill="url(#board)" filter="url(#shadow)"/>

  <!-- hand-drawn ink line being written -->
  <path d="M262 560 C 318 420, 372 420, 402 520 S 486 640, 540 520 S 620 380, 676 470"
        fill="none" stroke="#24206B" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- marker, tip resting on the end of the line -->
  <g transform="translate(676 470) rotate(38)" filter="url(#shadow)">
    <path d="M0 0 L 34 -30 L 70 -30 L 70 30 L 34 30 Z" fill="#24206B"/>
    <rect x="66" y="-46" width="96" height="92" rx="14" fill="#E9E7FF"/>
    <rect x="152" y="-52" width="250" height="104" rx="30" fill="url(#body)"/>
    <rect x="186" y="-52" width="22" height="104" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
